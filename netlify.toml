# Déploiement Netlify : https://app.netlify.com → "Add new site" → importer le dépôt.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Cache long pour les fichiers versionnés (hash dans le nom)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
